[package]
name = "kingdoms_sim"
description = "Deterministic kingdom simulation for KINGDOMS (no graphics dependencies)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
bincode = { version = "2.0.1", features = ["serde"] }
crc32fast = "1.5"
glam = { version = "0.34.3", features = ["serde"] }
libm = "0.2.16"
log = "0.4.35"
rand = "0.10.4"
rand_chacha = { version = "0.10.0", features = ["serde"] }
ron = "0.12.3"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
uuid = { version = "1.29.3", features = ["serde"] }
