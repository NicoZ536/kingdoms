[package]
name = "kingdoms_engine"
description = "Custom modular 2D/isometric game framework for KINGDOMS (wgpu + winit + egui)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
bytemuck = { version = "1.25.2", features = ["derive"] }
egui = { version = "0.37", features = ["default_fonts"] }
egui-wgpu = "0.37"
egui-winit = "0.37"
env_logger = "0.11.12"
glam = { version = "0.34.3", features = ["serde"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
log = "0.4.35"
pollster = "1.0.3"
rodio = { version = "0.23", default-features = false, features = ["playback", "vorbis", "wav", "mp3", "flac"] }
ron = "0.12.3"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
wgpu = "30"
winit = { version = "0.30.13", features = ["serde"] }
