[package]
name = "kingdoms_assetgen"
description = "Generates the placeholder sprite atlases for KINGDOMS (deterministic, procedural)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }
kingdoms_engine = { path = "../../crates/engine" }
ron = "0.12.3"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
